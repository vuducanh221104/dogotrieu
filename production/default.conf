upstream backend-ecommerce {
    server backend:4000;
}

upstream nextjs {
    server nextjs:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name dogotrieu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dogotrieu.com;
    client_max_body_size 500M;

    ssl_certificate /etc/nginx/certs/public.pem; 
    ssl_certificate_key /etc/nginx/certs/private.key; 
    ssl_trusted_certificate /etc/nginx/certs/origin_ca_rsa_root.pem; 
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://backend-ecommerce;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Backend-Server;
        proxy_redirect off;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/dogotrieu_access.log;
    error_log /var/log/nginx/dogotrieu_error.log;
}
