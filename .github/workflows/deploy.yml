name: Build and Push Docker Images

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create Server .env file
        run: |
          cat > Server/.env << EOF
          PORT=4000
          BASE_URL_CLIENT=${{ secrets.BASE_URL_CLIENT }}
          BASE_URL_CLIENT_2=${{ secrets.BASE_URL_CLIENT }}
          BASE_URL_SERVER=${{ secrets.BASE_URL_SERVER }}
          BASE_URL_CLIENT_DOMAIN=${{ secrets.BASE_URL_CLIENT }}
          DOMAIN=${{ secrets.DOMAIN }}
          JWT_ACCESS_KEY=${{ secrets.JWT_ACCESS_KEY }}
          JWT_REFRESH_KEY=${{ secrets.JWT_REFRESH_KEY }}
          NODE_ENV=production
          DB_URI=${{ secrets.DB_URI }}
          GOOGLE_APP_ID=${{ secrets.GOOGLE_APP_ID }}
          GOOGLE_APP_SECRET=${{ secrets.GOOGLE_APP_SECRET }}
          GOOGLE_APP_REDIRECT_LOGIN=${{ secrets.GOOGLE_APP_REDIRECT_LOGIN }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          EOF

      - name: Create Client .env file
        run: |
          cat > Client/.env << EOF
          NEXT_PUBLIC_CLIENT_URL=${{ secrets.BASE_URL_CLIENT }}
          NEXT_PUBLIC_SERVER_URL=${{ secrets.BASE_URL_SERVER }}
          NEXT_PUBLIC_DOMAIN=${{ secrets.BASE_URL_CLIENT }}
          NEXT_PUBLIC_SERVER_URL_ORI=${{ secrets.BASE_URL_SERVER }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_AUTH_ACCOUNT=${{ secrets.AUTH_ACCOUNT }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PRIVATE_TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_URL_IMAGE_SEO=${{ secrets.URL_IMAGE_SEO }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EOF

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Client
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
